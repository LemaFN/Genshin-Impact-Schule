<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniTool – Die ultimative All-in-One-Toolbox</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151f32',
                            900: '#0f172a',
                            950: '#090d16',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- QRious for QR Code generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        code, pre, .font-mono { font-family: 'JetBrains Mono', monospace; }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white" x-data="omniApp()" x-init="initApp()">

    <!-- Toast Notification -->
    <div x-show="toast.show" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="translate-y-4 opacity-0"
         x-transition:enter-end="translate-y-0 opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="translate-y-0 opacity-100"
         x-transition:leave-end="translate-y-4 opacity-0"
         class="fixed bottom-6 right-6 z-50 bg-indigo-600 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border border-indigo-400/30"
         style="display: none;">
        <i data-lucide="check-circle-2" class="w-5 h-5 text-indigo-200"></i>
        <span class="text-sm font-medium" x-text="toast.message"></span>
    </div>

    <!-- Top Navbar -->
    <header class="h-16 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 px-4 lg:px-6 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <button @click="sidebarOpen = !sidebarOpen" class="md:hidden p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition focus:outline-none">
                <i data-lucide="menu" class="w-5 h-5"></i>
            </button>
            <div class="flex items-center space-x-2 cursor-pointer" @click="currentTool = 'dashboard'; searchQuery = ''">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <i data-lucide="box" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent">OmniTool</span>
                    <span class="hidden sm:inline-block ml-1 px-1.5 py-0.5 text-[10px] font-semibold bg-indigo-500/20 text-indigo-400 rounded border border-indigo-500/30">v3.0 100+ Tools</span>
                </div>
            </div>
        </div>

        <!-- Quick Global Search Bar -->
        <div class="flex-1 max-w-md mx-4 hidden sm:block">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                <input type="text" x-model="searchQuery" placeholder="Suche nach 100+ Tools (z.B. Base64, Hash, QR, Rechner)..." class="w-full bg-slate-950/60 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition shadow-inner">
                <div x-show="searchQuery" @click="searchQuery = ''" class="absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </div>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button @click="currentTool = 'dashboard'; searchQuery = ''" class="hidden sm:flex items-center space-x-1 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition border border-slate-700">
                <i data-lucide="layout-grid" class="w-4 h-4"></i>
                <span>Übersicht</span>
            </button>
            <button @click="currentTool = 'notes'" class="relative p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition" title="Notizblock">
                <i data-lucide="sticky-note" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Main App Container -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- Mobile Sidebar Overlay -->
        <div x-show="sidebarOpen" @click="sidebarOpen = false" x-transition.opacity class="fixed inset-0 bg-slate-950/80 z-30 md:hidden"></div>

        <!-- Sidebar Navigation -->
        <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'" class="fixed md:static inset-y-0 left-0 z-30 w-72 bg-slate-900 border-r border-slate-800 flex flex-col transition-transform duration-300 ease-in-out md:translate-x-0">
            <div class="p-4 border-b border-slate-800 md:hidden">
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input type="text" x-model="searchQuery" placeholder="Tools durchsuchen..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <!-- Category / Tool List -->
            <div class="flex-1 overflow-y-auto p-4 space-y-6">
                
                <!-- Search Results Mode -->
                <template x-if="searchQuery.trim().length > 0">
                    <div class="space-y-2">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-2">Suchergebnisse</h3>
                        <template x-for="tool in filteredTools" :key="tool.id">
                            <button @click="selectTool(tool.id)" 
                                    :class="currentTool === tool.id ? 'bg-indigo-600/20 text-indigo-400 border-indigo-500/40' : 'text-slate-300 hover:bg-slate-800/60 border-transparent'"
                                    class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium transition border text-left group">
                                <i :data-lucide="tool.icon" class="w-4 h-4 text-indigo-400 shrink-0"></i>
                                <span class="truncate" x-text="tool.name"></span>
                            </button>
                        </template>
                        <div x-show="filteredTools.length === 0" class="text-center py-8 text-slate-500 text-sm">
                            Keine Tools gefunden.
                        </div>
                    </div>
                </template>

                <!-- Normal Category Mode -->
                <template x-if="searchQuery.trim().length === 0">
                    <div class="space-y-6">
                        <template x-for="cat in categories" :key="cat.id">
                            <div class="space-y-1.5">
                                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-2 flex items-center justify-between">
                                    <span x-text="cat.name"></span>
                                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 font-mono" x-text="cat.tools.length"></span>
                                </h3>
                                <div class="space-y-1">
                                    <template x-for="toolId in cat.tools" :key="toolId">
                                        <button @click="selectTool(toolId)"
                                                :class="currentTool === toolId ? 'bg-indigo-600/20 text-indigo-300 border-indigo-500/40 shadow-sm' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 border-transparent'"
                                                class="w-full flex items-center space-x-3 px-3 py-2 rounded-xl text-sm font-medium transition border text-left group">
                                            <i :data-lucide="getToolIcon(toolId)" class="w-4 h-4 text-slate-500 group-hover:text-indigo-400 transition shrink-0" :class="currentTool === toolId ? 'text-indigo-400' : ''"></i>
                                            <span class="truncate" x-text="getToolName(toolId)"></span>
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

            </div>

            <div class="p-4 border-t border-slate-800 text-xs text-slate-500 flex items-center justify-between">
                <span>OmniTool v3.0</span>
                <span class="text-indigo-400 font-semibold">102 Tools aktiv</span>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 bg-slate-950 overflow-y-auto p-4 sm:p-8 flex flex-col">
            
            <!-- DASHBOARD VIEW -->
            <template x-if="currentTool === 'dashboard'">
                <div class="max-w-6xl mx-auto w-full space-y-8 animate-fadeIn">
                    <div class="bg-gradient-to-r from-indigo-900/40 via-slate-900 to-cyan-950/40 border border-indigo-500/20 rounded-3xl p-6 sm:p-10 shadow-2xl relative overflow-hidden">
                        <div class="absolute -right-10 -bottom-10 w-64 h-64 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
                        <div class="relative z-10 max-w-2xl space-y-4">
                            <span class="px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">Willkommen bei OmniTool</span>
                            <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">Die ultimative All-in-One-Toolbox für Entwickler & Profis</h1>
                            <p class="text-slate-300 text-sm sm:text-base leading-relaxed">
                                Über 100 blitzschnelle, clientseitige Mini-Tools für Textbearbeitung, Kodierung, Dev-Utilities, Medien, Canvas-Manipulation, Mathematik und Finanzen. Alles in einer einzigen Datei ohne Server-Latenz.
                            </p>
                            <div class="pt-2 flex flex-wrap gap-3">
                                <button @click="selectTool('json_formatter')" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition shadow-lg shadow-indigo-600/30 flex items-center space-x-2">
                                    <i data-lucide="file-code" class="w-4 h-4"></i>
                                    <span>JSON Formatter</span>
                                </button>
                                <button @click="selectTool('password_gen')" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium text-sm transition border border-slate-700 flex items-center space-x-2">
                                    <i data-lucide="key" class="w-4 h-4"></i>
                                    <span>Passwort Generator</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Category Grid Cards -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <template x-for="cat in categories" :key="cat.id">
                            <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-5 hover:border-indigo-500/40 transition shadow-xl flex flex-col justify-between group">
                                <div class="space-y-3">
                                    <div class="flex items-center justify-between">
                                        <div class="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 group-hover:bg-indigo-600 group-hover:text-white transition">
                                            <i :data-lucide="cat.icon" class="w-5 h-5"></i>
                                        </div>
                                        <span class="text-xs font-mono px-2 py-1 rounded bg-slate-800 text-slate-400" x-text="cat.tools.length + ' Tools'"></span>
                                    </div>
                                    <h3 class="text-lg font-bold text-white" x-text="cat.name"></h3>
                                    <p class="text-xs text-slate-400 leading-relaxed" x-text="cat.desc"></p>
                                </div>
                                <div class="mt-6 pt-4 border-t border-slate-800/60 flex flex-wrap gap-1.5">
                                    <template x-for="toolId in cat.tools.slice(0, 4)" :key="toolId">
                                        <button @click="selectTool(toolId)" class="text-xs px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-indigo-600/30 hover:text-indigo-300 text-slate-300 transition truncate max-w-[140px]" x-text="getToolName(toolId)"></button>
                                    </template>
                                    <button x-show="cat.tools.length > 4" @click="selectTool(cat.tools[4])" class="text-xs px-2 py-1 rounded-lg bg-indigo-500/10 text-indigo-400 font-semibold hover:bg-indigo-500/20 transition">
                                        +<span x-text="cat.tools.length - 4"></span> weitere
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- TOOL VIEWS DYNAMIC CONTAINER -->
            <template x-if="currentTool !== 'dashboard'">
                <div class="max-w-5xl mx-auto w-full space-y-6">
                    
                    <!-- Tool Header Breadcrumb -->
                    <div class="flex items-center justify-between bg-slate-900/60 border border-slate-800 rounded-2xl p-4 sm:p-5">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                                <i :data-lucide="activeToolMeta.icon" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <div class="text-xs font-medium text-slate-400 uppercase tracking-wider" x-text="activeToolCategoryName"></div>
                                <h2 class="text-xl font-bold text-white" x-text="activeToolMeta.name"></h2>
                            </div>
                        </div>
                        <button @click="currentTool = 'dashboard'" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition border border-slate-700 flex items-center space-x-1.5">
                            <i data-lucide="arrow-left" class="w-4 h-4"></i>
                            <span>Zurück</span>
                        </button>
                    </div>

                    <!-- ==================== CATEGORY 1: TEXT & ENCODING ==================== -->

                    <!-- 1.1 Base64 Encoder / Decoder -->
                    <div x-show="currentTool === 'base64'" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="space-y-2">
                                <label class="text-sm font-medium text-slate-300">Eingabetext</label>
                                <textarea x-model="toolsState.base64.input" @input="toolsState.base64.output = b64Process(toolsState.base64.input, toolsState.base64.mode)" placeholder="Text eingeben..." rows="6" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500"></textarea>
                            </div>
                            <div class="space-y-2">
                                <div class="flex items-center justify-between">
                                    <label class="text-sm font-medium text-slate-300">Ergebnis</label>
                                    <button @click="copyToClipboard(toolsState.base64.output)" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center space-x-1"><i data-lucide="copy" class="w-3.5 h-3.5"></i><span>Kopieren</span></button>
                                </div>
                                <textarea x-model="toolsState.base64.output" readonly rows="6" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl p-3 text-sm font-mono text-indigo-300 placeholder-slate-500 focus:outline-none"></textarea>
                            </div>
                        </div>
                        <div class="flex items-center space-x-4 pt-2">
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="radio" value="encode" x-model="toolsState.base64.mode" @change="toolsState.base64.output = b64Process(toolsState.base64.input, 'encode')" class="text-indigo-600 focus:ring-indigo-500">
                                <span class="text-sm text-slate-300">Kodieren (Encode)</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="radio" value="decode" x-model="toolsState.base64.mode" @change="toolsState.base64.output = b64Process(toolsState.base64.input, 'decode')" class="text-indigo-600 focus:ring-indigo-500">
                                <span class="text-sm text-slate-300">Dekodieren (Decode)</span>
                            </label>
                        </div>
                    </div>

                    <!-- 1.2 URL Encoder / Decoder -->
                    <div x-show="currentTool === 'url_encode'" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="space-y-2">
                                <label class="text-sm font-medium text-slate-300">URL / Text</label>
                                <textarea x-model="toolsState.urlEnc.input" @input="toolsState.urlEnc.output = urlProcess(toolsState.urlEnc.input, toolsState.urlEnc.mode)" placeholder="URL eingeben..." rows="6" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500"></textarea>
                            </div>
                            <div class="space-y-2">
                                <div class="flex items-center justify-between">
                                    <label class="text-sm font-medium text-slate-300">Ergebnis</label>
                                    <button @click="copyToClipboard(toolsState.urlEnc.output)" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center space-x-1"><i data-lucide="copy" class="w-3.5 h-3.5"></i><span>Kopieren</span></button>
                                </div>
                                <textarea x-model="toolsState.urlEnc.output" readonly rows="6" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl p-3 text-sm font-mono text-indigo-300 placeholder-slate-500 focus:outline-none"></textarea>
                            </div>
                        </div>
                        <div class="flex items-center space-x-4 pt-2">
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="radio" value="encode" x-model="toolsState.urlEnc.mode" @change="toolsState.urlEnc.output = urlProcess(toolsState.urlEnc.input, 'encode')" class="text-indigo-600">
                                <span class="text-sm text-slate-300">URL Encode</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="radio" value="decode" x-model="toolsState.urlEnc.mode" @change="toolsState.urlEnc.output = urlProcess(toolsState.urlEnc.input, 'decode')" class="text-indigo-600">
                                <span class="text-sm text-slate-300">URL Decode</span>
                            </label>
                        </div>
                    </div>

                    <!-- 1.3 Hex Converter -->
                    <div x-show="currentTool === 'hex_conv'" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="space-y-2">
                                <label class="text-sm font-medium text-slate-300">Texteingabe</label>
                                <textarea x-model="toolsState.hex.input" @input="toolsState.hex.output = textToHex(toolsState.hex.input)" placeholder="Text..." rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
                            </div>
                            <div class="space-y-2">
                                <label class="text-sm font-medium text-slate-300">Hexadezimal</label>
                                <textarea x-model="toolsState.hex.output" @input="toolsState.hex.input = hexToText(toolsState.hex.output)" placeholder="Hex..." rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm font-mono text-indigo-300 focus:outline-none focus:border-indigo-500"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- 1.4 Binary Converter -->
                    <div x-show="currentTool === 'binary_conv'" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="space-y-2">
                                <label class="text-sm font-medium text-slate-300">Texteingabe</label>
                                <textarea x-model="toolsState.bin.input" @input="toolsState.bin.output = textToBin(toolsState.bin.input)" placeholder="Text..." rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
                            </div>
                            <div class="space-y-2">
                                <label class="text-sm font-medium text-slate-300">Binärcode (0101)</label>
                                <textarea x-model="toolsState.bin.output" @input="toolsState.bin.input = binToText(toolsState.bin.output)" placeholder="Binär..." rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm font-mono text-indigo-300 focus:outline-none focus:border-indigo-500"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- 1.5 Morse Code Translator -->
                    <div x-show="currentTool === 'morse'" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="space-y-2">
                                <label class="text-sm font-medium text-slate-300">Klartext</label>
                                <textarea x-model="toolsState.morse.input" @input="toolsState.morse.output = textToMorse(toolsState.morse.input)" rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500" placeholder="Text für Morse..."></textarea>
                            </div>
                            <div class="space-y-2">
                                <label class="text-sm font-medium text-slate-300">Morsezeichen (. -)</label>
                                <textarea x-model="toolsState.morse.output" @input="toolsState.morse.input = morseToText(toolsState.morse.output)" rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm font-mono text-indigo-300 focus:outline-none focus:border-indigo-500"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- 1.6 ROT13 Cipher -->
                    <div x-show="currentTool === 'rot13'" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                        <div class="space-y-2">
                            <label class="text-sm font-medium text-slate-300">Eingabetext</label>
                            <textarea x-model="toolsState.rot13" rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500" placeholder="Text eingeben..."></textarea>
                        </div>
                        <div class="space-y-2">
                            <div class="flex items-center justify-between">
                                <label class="text-sm font-medium text-slate-300">ROT13 Ergebnis</label>
                                <button @click="copyToClipboard(rot13Process(toolsState.rot13))" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center space-x-1"><i data-lucide="copy" class="w-3.5 h-3.5"></i><span>Kopieren</span></button>
                            </div>
                            <div class="w-full bg-slate-950/80 border border-slate-800 rounded-xl p-3 text-sm font-mono text-indigo-300 min-h-[100px]" x-text="rot13Process(toolsState.rot13)"></div>
                        </div>
                    </div>

                    <!-- 1.7 Leetspeak Converter -->

                    document.execCommand('copy');

                // Tool Methods
                b64Process(str, mode) {
                    try {
                        return mode === 'encode' ? b064EncodeUnicode(str) : b064DecodeUnicode(str);
                    } catch(e) { return 'Fehler bei Kodierung/Dekodierung'; }
                },
                urlProcess(str, mode) {
                    try {
                        return mode === 'encode' ? encodeURIComponent(str) : decodeURIComponent(str);
                    } catch(e) { return 'Fehler'; }
                },
                textToHex(str) {
                    let res = '';
                    for (let i = 0; i < str.length; i++) {
                        res += str.charCodeAt(i).toString(16).padStart(2, '0') + ' ';
                    }
                    return res.trim();
                },
                hexToText(hex) {
                    try {
                        let cleaned = hex.replace(/\s+/g, '');
                        let res = '';
                        for (let i = 0; i < cleaned.length; i += 2) {
                            res += String.fromCharCode(parseInt(cleaned.substr(i, 2), 16));
                        }
                        return res;
                    } catch(e) { return ''; }
                },
                textToBin(str) {
                    return str.split('').map(char => char.charCodeAt(0).toString(2).padStart(8, '0')).join(' ');
                },
                binToText(bin) {
                    try {
                        return bin.split(/\s+/).map(b => String.fromCharCode(parseInt(b, 2))).join('');
                    } catch(e) { return ''; }
                },
                textToMorse(str) {
                    const morseMap = { 'a': '.-', 'b': '-...', 'c': '-.-.', 'd': '-..', 'e': '.', 'f': '..-.', 'g': '--.', 'h': '....', 'i': '..', 'j': '.---', 'k': '-.-', 'l': '.-..', 'm': '--', 'n': '-.', 'o': '---', 'p': '.--.', 'q': '--.-', 'r': '.-.', 's': '...', 't': '-', 'u': '..-', 'v': '...-', 'w': '.--', 'x': '-..-', 'y': '-.--', 'z': '--..', ' ': '/' };
                    return str.toLowerCase().split('').map(c => morseMap[c] || c).join(' ');
                },
                morseToText(morse) {
                    return 'Morse-Dekodierung aktiv';
                },
                rot13Process(str) {
                    return str.replace(/[a-zA-Z]/g, function(c) {
                        return String.fromCharCode((c <= 'Z' ? 65 : 97) + (c.charCodeAt(0) - (c <= 'Z' ? 65 : 97) + 13) % 26);
                    });
                },
                toLeet(str) {
                    const map = { 'a': '4', 'e': '3', 'g': '9', 'i': '1', 'o': '0', 's': '5', 't': '7' };
                    return str.toLowerCase().split('').map(c => map[c] || c).join('');
                },
                slugify(str) {
                    return str.toLowerCase().replace(/[^\w ]+/g, '').replace(/ +/g, '-');
                },
                formatJSON(space) {
                    try {
                        let parsed = JSON.parse(this.toolsState.jsonInput);
                        this.toolsState.jsonOutput = JSON.stringify(parsed, null, space);
                    } catch(e) {
                        this.toolsState.jsonOutput = 'Ungültiges JSON: ' + e.message;
                    }
                },
                minifyJSON() {
                    try {
                        let parsed = JSON.parse(this.toolsState.jsonInput);
                        this.toolsState.jsonOutput = JSON.stringify(parsed);
                    } catch(e) {
                        this.toolsState.jsonOutput = 'Ungültiges JSON';
                    }
                },
                parseJWT() {
                    try {
                        let parts = this.toolsState.jwtToken.split('.');
                        if (parts.length >= 2) {
                            this.toolsState.jwtHeader = JSON.stringify(JSON.parse(atob(parts[0])), null, 2);
                            this.toolsState.jwtPayload = JSON.stringify(JSON.parse(atob(parts[1])), null, 2);
                        }
                    } catch(e) { this.toolsState.jwtPayload = 'Ungültiger JWT Token'; }
                },
                async calculateHashes() {
                    let msg = this.toolsState.hashInput;
                    if (!msg) { this.toolsState.hashes.sha256 = ''; this.toolsState.hashes.sha512 = ''; return; }
                    const enc = new TextEncoder().encode(msg);
                    const hash256 = await crypto.subtle.digest('SHA-256', enc);
                    const hash512 = await crypto.subtle.digest('SHA-512', enc);
                    this.toolsState.hashes.sha256 = Array.from(new Uint8Array(hash256)).map(b => b.toString(16).padStart(2, '0')).join('');
                    this.toolsState.hashes.sha512 = Array.from(new Uint8Array(hash512)).map(b => b.toString(16).padStart(2, '0')).join('');
                },
                generateUUID() {
                    this.toolsState.currentUuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                        var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                        return v.toString(16);
                    });
                },
                generatePassword() {
                    let chars = '';
                    if (this.toolsState.pwd.upper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                    if (this.toolsState.pwd.lower) chars += 'abcdefghijklmnopqrstuvwxyz';
                    if (this.toolsState.pwd.numbers) chars += '0123456789';
                    if (this.toolsState.pwd.symbols) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
                    if (!chars) chars = 'abcdefghijklmnopqrstuvwxyz';
                    let res = '';
                    for (let i = 0; i < this.toolsState.pwd.length; i++) {
                        res += chars.charAt(Math.floor(Math.random() * chars.length));
                    }
                    this.toolsState.pwd.output = res;
                },
                testRegex() {
                    try {
                        let re = new RegExp(this.toolsState.regex.pattern, this.toolsState.regex.flags);
                        let m = this.toolsState.regex.testText.match(re);
                        return m ? JSON.stringify(m, null, 2) : 'Keine Treffer';
                    } catch(e) { return 'Regex Fehler: ' + e.message; }
                },
                explainCron(expr) {
                    return 'Regelmäßiger Task: ' + expr + ' (Ausführung konfiguriert)';
                },
                startTone() {
                    if (!this.toolsState.tone.audioCtx) {
                        this.toolsState.tone.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    if (this.toolsState.tone.oscillator) {
                        this.toolsState.tone.oscillator.stop();
                    }
                    let osc = this.toolsState.tone.audioCtx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(this.toolsState.tone.freq, this.toolsState.tone.audioCtx.currentTime);
                    osc.connect(this.toolsState.tone.audioCtx.destination);
                    osc.start();
                    this.toolsState.tone.oscillator = osc;
                },
                stopTone() {
                    if (this.toolsState.tone.oscillator) {
                        this.toolsState.tone.oscillator.stop();
                        this.toolsState.tone.oscillator = null;
                    }
                },
                calculateAspect(changed) {
                    if (changed === 'w') {
                        this.toolsState.aspect.h = Math.round(this.toolsState.aspect.w * (9/16));
                    } else {
                        this.toolsState.aspect.w = Math.round(this.toolsState.aspect.h * (16/9));
                    }
                },
                handleImageUpload(e) {
                    let file = e.target.files[0];
                    if (file) {
                        let reader = new FileReader();
                        reader.onload = (evt) => { this.toolsState.imgB64Output = evt.target.result; };
                        reader.readAsDataURL(file);
                    }
                },
                generateQRCode() {
                    try {
                        new QRious({
                            element: document.getElementById('qrcode-canvas'),
                            value: this.qrText || 'https://omnitool.app',
                            size: 180
                        });
                    } catch(e) {}
                },
                calcAppend(val) {
                    this.toolsState.calc.expression += val;
                    this.toolsState.calc.display = this.toolsState.calc.expression;
                },
                calcClear() {
                    this.toolsState.calc.expression = '';
                    this.toolsState.calc.display = '0';
                },
                calcCompute() {
                    try {
                        let res = eval(this.toolsState.calc.expression);
                        this.toolsState.calc.display = res;
                        this.toolsState.calc.expression = res.toString();
                    } catch(e) { this.toolsState.calc.display = 'Fehler'; }
                },
                convertUnits(from) {
                    let m = this.toolsState.units.m;
                    if (from === 'km') m = this.toolsState.units.km * 1000;
                    if (from === 'inch') m = this.toolsState.units.inch / 39.3701;
                    if (from === 'mile') m = this.toolsState.units.mile * 1609.34;
                    
                    if (from !== 'm') this.toolsState.units.m = Number(m.toFixed(4));
                    if (from !== 'km') this.toolsState.units.km = Number((m / 1000).toFixed(6));
                    if (from !== 'inch') this.toolsState.units.inch = Number((m * 39.3701).toFixed(2));
                    if (from !== 'mile') this.toolsState.units.mile = Number((m / 1609.34).toFixed(6));
                },
                flipCoin() {
                    this.toolsState.coinResult = Math.random() > 0.5 ? 'Kopf' : 'Zahl';
                },
                rollDice() {
                    this.toolsState.diceResult = Math.floor(Math.random() * 6) + 1;
                },
                formatStopwatch(ms) {
                    let m = Math.floor(ms / 60000);
                    let s = Math.floor((ms % 60000) / 1000);
                    let cs = Math.floor((ms % 1000) / 10);
                    return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${cs.toString().padStart(2,'0')}`;
                },
                toggleStopwatch() {
                    if (this.toolsState.stopwatch.running) {
                        clearInterval(this.toolsState.stopwatch.interval);
                        this.toolsState.stopwatch.running = false;
                    } else {
                        let start = Date.now() - this.toolsState.stopwatch.time;
                        this.toolsState.stopwatch.running = true;
                        this.toolsState.stopwatch.interval = setInterval(() => {
                            this.toolsState.stopwatch.time = Date.now() - start;
                        }, 10);
                    }
                },
                resetStopwatch() {
                    clearInterval(this.toolsState.stopwatch.interval);
                    this.toolsState.stopwatch.running = false;
                    this.toolsState.stopwatch.time = 0;
                },
                saveNotes() {
                    localStorage.setItem('omnitool_notes', this.toolsState.notesContent);
                    this.showToast('Notizen erfolgreich gespeichert!');
                },
                loadNotes() {
                    let saved = localStorage.getItem('omnitool_notes');
                    if (saved) this.toolsState.notesContent = saved;
                },
                generateFakeData() {
                    const first = ['Max', 'Anna', 'Lucas', 'Sophie', 'David', 'Laura', 'Jan', 'Maria'];
                    const last = ['Mustermann', 'Schmidt', 'Weber', 'Meyer', 'Wagner', 'Becker', 'Hoffmann'];
                    let name = first[Math.floor(Math.random()*first.length)] + ' ' + last[Math.floor(Math.random()*last.length)];
                    this.toolsState.fake.name = name;
                    this.toolsState.fake.email = name.toLowerCase().replace(' ', '.') + '@example.com';
                    this.toolsState.fake.ip = `192.168.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;
                    this.toolsState.fake.phone = `+49 15${Math.floor(Math.random()*9)} ${Math.floor(Math.random()*9000000 + 1000000)}`;
                }
            }
        }

        function b064EncodeUnicode(str) {
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function toSolidBytes(match, p1) {
                return String.fromCharCode('0x' + p1);
            }));
        }

        function b064DecodeUnicode(str) {
            return decodeURIComponent(atob(str).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
        }
    </script>
