name: Build & Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Seiten und Hauptseite bauen
        run: |
          python3 - <<'PY'
          import html, pathlib, re

          out = pathlib.Path("_site")
          out.mkdir(exist_ok=True)
          (out / ".nojekyll").write_text("")

          BACK = (
              '<a href="./index.html" style="position:fixed;top:14px;left:14px;'
              'z-index:99999;padding:10px 16px;border-radius:999px;'
              'background:rgba(20,20,35,.85);color:#fff;text-decoration:none;'
              'font:600 14px system-ui,sans-serif;border:1px solid rgba(255,255,255,.25);'
              'backdrop-filter:blur(8px)">&larr; Übersicht</a>'
          )

          TXT_PAGE = """<!DOCTYPE html>
          <html lang="de"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>__TITLE__</title>
          <style>
          body{margin:0;background:#0f1020;color:#e8e8f5;font-family:system-ui,sans-serif}
          main{max-width:900px;margin:0 auto;padding:80px 20px 40px}
          h1{font-size:1.6rem;margin:0 0 20px}
          pre{white-space:pre-wrap;word-wrap:break-word;background:#171830;
              padding:20px;border-radius:16px;line-height:1.55;
              border:1px solid rgba(255,255,255,.08)}
          </style></head><body>__BACK__
          <main><h1>__TITLE__</h1><pre>__CONTENT__</pre></main>
          </body></html>"""

          INDEX = """<!DOCTYPE html>
          <html lang="de"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Genshin Impact Schule</title>
          <style>
          *{box-sizing:border-box}
          body{margin:0;min-height:100vh;color:#fff;
               font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
               background:radial-gradient(circle at 20% 10%,#3b2a7a 0,transparent 45%),
                          radial-gradient(circle at 85% 90%,#0e6a8a 0,transparent 45%),
                          #0c0d1c;
               background-attachment:fixed}
          .wrap{max-width:1000px;margin:0 auto;padding:60px 20px 40px}
          header{text-align:center;margin-bottom:48px}
          h1{font-size:clamp(2rem,6vw,3.4rem);margin:0 0 12px;letter-spacing:-.02em;
             background:linear-gradient(90deg,#ffd86b,#ff8fd0,#7fd4ff);
             -webkit-background-clip:text;background-clip:text;color:transparent}
          header p{margin:0;color:#b9bad6;font-size:1.1rem}
          .grid{display:grid;gap:20px;
                grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
          .card{display:flex;align-items:center;gap:18px;padding:26px;
                border-radius:22px;text-decoration:none;color:#fff;
                background:rgba(255,255,255,.07);
                border:1px solid rgba(255,255,255,.14);
                backdrop-filter:blur(10px);
                transition:transform .2s,background .2s,box-shadow .2s}
          .card:hover,.card:active{transform:translateY(-6px) scale(1.02);
                background:rgba(255,255,255,.14);
                box-shadow:0 18px 40px rgba(0,0,0,.45)}
          .icon{flex:none;width:64px;height:64px;border-radius:18px;
                display:grid;place-items:center;font-size:2rem;
                background:linear-gradient(135deg,#6c5ce7,#00b4d8)}
          .card:nth-child(3n+2) .icon{background:linear-gradient(135deg,#ff7eb3,#ff758c)}
          .card:nth-child(3n+3) .icon{background:linear-gradient(135deg,#f6d365,#fda085)}
          .name{font-size:1.2rem;font-weight:700;line-height:1.25;word-break:break-word}
          .type{margin-top:4px;font-size:.85rem;color:#b9bad6}
          .arrow{margin-left:auto;font-size:1.6rem;opacity:.6}
          footer{text-align:center;margin-top:50px;color:#7f80a3;font-size:.9rem}
          </style></head><body>
          <div class="wrap">
            <header>
              <h1>Genshin Impact Schule</h1>
              <p>Wähle aus, was du öffnen möchtest (__COUNT__ Seiten)</p>
            </header>
            <div class="grid">
          __CARDS__
            </div>
            <footer>Automatisch generiert mit GitHub Actions</footer>
          </div></body></html>"""

          skip = {"index.html", "readme.txt"}
          files = sorted(
              (p for p in pathlib.Path(".").iterdir()
               if p.is_file()
               and not p.name.startswith(".")
               and p.suffix.lower() in (".html", ".htm", ".txt")
               and p.name.lower() not in skip),
              key=lambda p: p.name.lower(),
          )

          cards = []
          for p in files:
              slug = re.sub(r"[^a-z0-9]+", "-", p.stem.lower()).strip("-") or "seite"
              target = slug + ".html"
              title = re.sub(r"[_\s]+", " ", p.stem).strip()
              text = p.read_text(encoding="utf-8", errors="replace")
              head = text[:3000].lower()
              is_html = p.suffix.lower() in (".html", ".htm") or any(
                  t in head for t in ("<!doctype html", "<html", "<body")
              )

              if is_html:
                  idx = text.lower().rfind("</body>")
                  page = text[:idx] + BACK + text[idx:] if idx != -1 else text + BACK
                  icon, kind = "🌐", "Interaktive Seite"
              else:
                  page = (TXT_PAGE.replace("__TITLE__", html.escape(title))
                                  .replace("__BACK__", BACK)
                                  .replace("__CONTENT__", html.escape(text)))
                  icon, kind = "📄", "Textdokument"

              (out / target).write_text(page, encoding="utf-8")
              cards.append(
                  f'    <a class="card" href="{target}">'
                  f'<div class="icon">{icon}</div>'
                  f'<div><div class="name">{html.escape(title)}</div>'
                  f'<div class="type">{kind}</div></div>'
                  f'<div class="arrow">&rsaquo;</div></a>'
              )

          index = (INDEX.replace("__CARDS__", "\n".join(cards))
                        .replace("__COUNT__", str(len(cards))))
          (out / "index.html").write_text(index, encoding="utf-8")
          print(f"{len(cards)} Seiten gebaut")
          PY

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
