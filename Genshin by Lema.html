const C=[
{n:'Flins',fx:1,pt:'snow',i:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6hF30sMBhCq3vt1OeTyuolehzak-1C31XtR76LKEG_McGBXLRxK4y_PJ6&s=10',t:'Lighthouse Keeper of Nod-Krai',b:'#08131f',c:'#9fd8ff',m:'fl',l:`*Flins* is the last surviving Snowland Fae, serving as the reclusive *Lighthouse Keeper* of Nod-Krai. Haunted by the traumatic loss of his fallen comrades against the Abyss, he escaped reality into a long, deep slumber. After finally awakening, his path crosses with the *Traveler,* to whom he surprisingly reveals his true mystical nature.`},
{n:'Raiden Shogun',fx:0,pt:'spark',i:'https://static.wikia.nocookie.net/genshin-impact/images/e/ec/Raiden_Karte.jpg/revision/latest?cb=20211123185857&path-prefix=de',t:'Ruler of the Land of Eternity',b:'#150a28',c:'#b98cff',m:'rs',l:`The *Raiden Shogun* is the vessel of the Electro Archon, seeking a frozen *“Eternity”* for Inazuma after losing her loved ones to tragedy. To escape the erosion of time, she shut her soul inside a sword and created a puppet to rule the nation. Her ruthless isolation was finally broken when the *Traveler* arrived and challenged her ideals.`},
{n:'The Traveler',fx:2,pt:'orb',i:'https://static.wikia.nocookie.net/topstrongest/images/0/0f/TravelersInfo.jpg/revision/latest?cb=20220209181022',t:'You can choose between the twins',b:'#0a1c1a',c:'#7be3c8',m:'tr',l:`The Travelers have a lot of lore, and much still hasn’t been enlightened — here is a small cutout. The *Traveler* is a world-hopping twin who lost their sibling to a mysterious deity upon arriving in Teyvat. Stripped of their original power and stuck in an unfamiliar world, they embark on a grand journey across all *seven nations.* Along the way, they master multiple *elements* without a Vision while searching for answers and their lost family.`},
{n:'Odette',fx:3,pt:'diamond',i:'https://static.wikia.nocookie.net/gensin-impact/images/f/f3/Odette_Card.png/revision/latest?cb=20260703040217',t:'Newly released',b:'#160913',c:'#ff6f9c',m:'od',l:`*Odette* is a mysterious new figure in *Teyvat* whose past is still shrouded in dark secrets. Driven by a personal vendetta, she navigates the shadows of the nations while hiding her true motivations from those around her. Her unexpected arrival catches the attention of the Traveler, as her fate seems deeply tied to the upcoming conflicts.`},
{n:'Varesa',fx:6,pt:'diamond',i:'https://static.wikia.nocookie.net/gensin-impact/images/a/a7/Varesa_Card.png/revision/latest?cb=20250217100445',t:'Orchard owner of the Collective of Plenty',b:'#2b1304',c:'#ffa840',m:'vr',l:`*Varesa* is an easy-going warrior and orchard owner from Natlan’s *Collective of Plenty.* Adored by local children as the *“Masked Hero,”* she possesses immense martial strength alongside a legendary, *insatiable appetite* for food. Despite her relaxed lifestyle, she is highly dedicated to defending her nation against any incoming threats.`},
{a:1,n:'The most popular Fatui Harbingers',t:'',b:'#0b0b10',c:'#D4AF37',m:'',l:`From the 4th Harbinger up to the *Archon of Snezhnaya.*`},
{n:'Arlecchino',fx:8,pt:'ember',i:'https://mediaproxy.tvtropes.org/width/1200/https://static.tvtropes.org/pmwiki/pub/images/arlecchino_2.png',r:'IV',t:'The 4th Harbinger',b:'#1c0606',c:'#ff4d3d',m:'ar',l:`In the story, she becomes your ally and “friend” … She also owns an *orphanage* named House of the Fireplace, where her *“Kids”* also call her *“Father.”* She still is one of the best characters to play and definitely has a lot of aura.`},
{n:'Columbina',fx:7,pt:'orb',rot:1,i:'https://upload-os-bbs.hoyolab.com/upload/2026/09/06/456185605/cb25754074d93f7b7614160121801c33_3168069428031414267.jpg',r:'III',t:'The 3rd Harbinger',b:'#0a1030',c:'#a8c2ff',m:'co',l:`*Columbina* is your biggest friend in the Nod-Krai story quest … You fight against *Il Dottore* and much more. She has multiple names: *Kutaar (Mondmädchen),* *Columbina Hyposelenia* and *Moon Maiden.*`},
{n:'Il Dottore',fx:4,pt:'bubble',i:['https://i.pinimg.com/originals/dd/69/58/dd6958420cb8f758ec8c5eb82c215f4e.jpg','https://imgs.search.brave.com/mcuc8t3sK7DbQEtaphV5UMVz2g8KAB4qOnM9Cq-YXh8/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pLnBp/bmltZy5jb20vb3JpZ2luYWxzL2RkLzY5/LzU4L2RkNjk1ODQy/MGNiOGY3NThlYzhj/NWViODJjMjE1ZjRl/LmpwZw','https://static.wikia.nocookie.net/gensin-impact/images/d/d6/Dottore_Card.png/revision/latest?cb=20250217100445'],r:'II',t:'The 2nd Harbinger',b:'#06201a',c:'#5ef5b0',m:'dt',l:`*Dottore* is the 2nd Harbinger … In the Sumeru storyline he almost creates a new god, and in the Nod-Krai story quest he collects the power of the *3 Moons* and almost became a godlike human.`},
{n:'Capitano',fx:10,pt:'ember',i:['https://i.pinimg.com/originals/42/ba/27/42ba274d7d8fe2262e476759e5623c4a.jpg','https://imgs.search.brave.com/4c31LVaO5SGsWSmdDsnBiqI5a3ihsN3eGzW5xT8MUtI/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pLnBp/bmltZy5jb20vb3JpZ2luYWxzLzQyL2Jh/LzI3LzQyYmEyNzRk/N2Q4ZmUyMjYyZTQ3/Njc1OWU1NjIzYzRh/LmpwZw','https://static.wikia.nocookie.net/gensin-impact/images/4/4b/Capitano_Card.png/revision/latest?cb=20240903040217'],r:'I',t:'The 1st Harbinger',b:'#240b04',c:'#ff8b2e',m:'cp',l:`In the Natlan storyline he fights against *Mavuika, the Pyro Archon,* but all he wants is her *Gnosis,* to fight against the *Heavenly Principles.*`},
{n:'Pierro',fx:9,pt:'diamond',cr:[.32,.1],i:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmKr7sziUCPo3a6z1bHaEgagvbu7MatctY2UIy3zTsgazX61Wli-Hswd8&s=10',t:'Director of the Fatui Harbingers',b:'#1d0612',c:'#ff5d82',m:'pi',l:`*Pierro* is the *Director* of the Fatui Harbingers and with that the direct contact person for the *Tsaritsa.*`},
