<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Dev & Media Toolbox</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            600: '#475569'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-dark-900 text-slate-100 font-sans min-h-screen flex flex-col" x-data="toolboxApp()">

    <!-- Top Navigation -->
    <header class="bg-dark-800 border-b border-dark-700 sticky top-0 z-50 px-4 py-3 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <button @click="sidebarOpen = !sidebarOpen" class="p-2 rounded-lg bg-dark-700 hover:bg-dark-600 transition text-slate-200 focus:outline-none">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <div class="flex items-center space-x-2">
                <i data-lucide="wrench" class="w-7 h-7 text-indigo-400"></i>
                <h1 class="text-xl font-bold tracking-wider bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Ultimate Toolbox</h1>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <span class="text-xs px-2.5 py-1 bg-indigo-900/50 text-indigo-300 border border-indigo-700/50 rounded-full font-medium">80+ Tools v3.0</span>
        </div>
    </header>

    <div class="flex flex-1 relative overflow-hidden">
        
        <!-- Backdrop for Mobile Sidebar -->
        <div x-show="sidebarOpen" @click="sidebarOpen = false" x-transition.opacity class="fixed inset-0 bg-black/60 z-30 md:hidden" x-cloak></div>

        <!-- Sidebar Navigation -->
        <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'" class="fixed md:static inset-y-0 left-0 z-40 w-72 bg-dark-800 border-r border-dark-700 transform transition-transform duration-300 ease-in-out flex flex-col">
            <div class="p-4 border-b border-dark-700 flex items-center justify-between">
                <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Kategorien</span>
                <button @click="sidebarOpen = false" class="md:hidden p-1 rounded hover:bg-dark-700 text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <nav class="flex-1 overflow-y-auto p-3 space-y-1">
                <template x-for="cat in categories" :key="cat.id">
                    <button @click="currentCategory = cat.id; if(window.innerWidth < 768) sidebarOpen = false;" 
                            :class="currentCategory === cat.id ? 'bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/20' : 'text-slate-300 hover:bg-dark-700 hover:text-white'"
                            class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl transition text-sm text-left">
                        <i :data-lucide="cat.icon" class="w-4 h-4"></i>
                        <span x-text="cat.name"></span>
                    </button>
                </template>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-dark-900">
            <div class="max-w-6xl mx-auto">
                
                <!-- Dynamic Tool Display Header -->
                <div class="mb-6 pb-4 border-b border-dark-700 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-white flex items-center gap-2">
                            <span x-text="getCurrentCategoryName()"></span>
                        </h2>
                        <p class="text-sm text-slate-400 mt-1">Wähle eines der integrierten Utilities aus oder nutze die Live-Tools.</p>
                    </div>
                </div>

                <!-- TOOLS GRID CONTAINER -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <template x-for="tool in getToolsForCategory()" :key="tool.id">
                        <div class="bg-dark-800 border border-dark-700 rounded-2xl p-5 flex flex-col justify-between shadow-lg hover:border-indigo-500/50 transition">
                            <div>
                                <div class="flex items-center justify-between mb-3">
                                    <h3 class="font-bold text-base text-white flex items-center gap-2">
                                        <i :data-lucide="tool.icon" class="w-5 h-5 text-indigo-400"></i>
                                        <span x-text="tool.name"></span>
                                    </h3>
                                    <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 bg-dark-700 text-slate-300 rounded" x-text="tool.tag"></span>
                                </div>
                                <p class="text-xs text-slate-400 mb-4" x-text="tool.desc"></p>
                                
                                <!-- Interactive Elements per Tool (Beispiele) -->
                                <div class="space-y-3">
                                    <template x-if="tool.type === 'input-output'">
                                        <div>
                                            <textarea x-model="tool.input" @input="tool.action(tool)" placeholder="Eingabe hier..." class="w-full h-20 bg-dark-900 border border-dark-700 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 resize-none font-mono"></textarea>
                                            <div class="mt-2">
                                                <textarea readonly x-model="tool.output" placeholder="Ausgabe..." class="w-full h-20 bg-dark-900 border border-dark-700 rounded-lg p-2.5 text-xs text-indigo-300 focus:outline-none resize-none font-mono"></textarea>
                                            </div>
                                        </div>
                                    </template>

                                    <template x-if="tool.type === 'generator'">
                                        <div>
                                            <input type="text" readonly x-model="tool.output" class="w-full bg-dark-900 border border-dark-700 rounded-lg p-2 text-xs text-indigo-300 font-mono mb-2">
                                            <button @click="tool.action(tool)" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg transition shadow">Generieren</button>
                                        </div>
                                    </template>

                                    <template x-if="tool.type === 'media-cutter'">
                                        <div class="border border-dashed border-dark-600 rounded-lg p-4 text-center cursor-pointer hover:bg-dark-700/50 transition">
                                            <i data-lucide="video" class="w-8 h-8 mx-auto text-indigo-400 mb-2"></i>
                                            <p class="text-xs text-slate-300 font-medium">Video / Audio ablegen</p>
                                            <span class="text-[10px] text-slate-500">Trimming & Konvertierung</span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

            </div>
        </main>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('toolboxApp', () => ({
                sidebarOpen: false,
                currentCategory: 'text',
                categories: [
                    { id: 'text', name: 'Text & Encoding', icon: 'file-text' },
                    { id: 'dev', name: 'Dev & Code Utilities', icon: 'code' },
                    { id: 'media', name: 'Media, Audio & Video', icon: 'film' },
                    { id: 'math', name: 'Math & Units', icon: 'calculator' },
                    { id: 'extras', name: 'Fun & Useless Extras', icon: 'sparkles' }
                ],
                tools: [
                    // Text & Encoding (viele Tools)
                    { id: 1, cat: 'text', name: 'Base64 Encoder / Decoder', tag: 'Text', icon: 'lock', desc: 'Kodiert und dekodiert Text in Base64.', type: 'input-output', input: '', output: '', action: (t) => { try { t.output = btoa(t.input); } catch(e) { t.output = 'Fehler beim Kodieren'; } } },
                    { id: 2, cat: 'text', name: 'URL Encoder / Decoder', tag: 'Text', icon: 'globe', desc: 'URL-Sonderzeichen umwandeln.', type: 'input-output', input: '', output: '', action: (t) => { t.output = encodeURIComponent(t.input); } },
                    { id: 3, cat: 'text', name: 'ROT13 Cipher', tag: 'Fun', icon: 'rotate-cw', desc: 'Einfache Caesar-Verschlüsselung.', type: 'input-output', input: '', output: '', action: (t) => { t.output = t.input.replace(/[a-zA-Z]/g, c => String.fromCharCode((c <= 'z' ? 90 : 122) >= (c = c.charCodeAt(0) + 13) ? c : c - 26)); } },
                    { id: 4, cat: 'text', name: 'UpperCase / LowerCase', tag: 'Text', icon: 'type', desc: 'Text-Formatierung ändern.', type: 'input-output', input: '', output: '', action: (t) => { t.output = t.input.toUpperCase(); } },
                    { id: 5, cat: 'text', name: 'Reverse Text', tag: 'Fun', icon: 'arrow-left-right', desc: 'Dreht Text um.', type: 'input-output', input: '', output: '', action: (t) => { t.output = t.input.split('').reverse().join(''); } },
                    { id: 6, cat: 'text', name: 'Word & Character Counter', tag: 'Stats', icon: 'bar-chart-2', desc: 'Zählt Wörter und Zeichen.', type: 'input-output', input: '', output: '', action: (t) => { t.output = `Zeichen: ${t.input.length} | Wörter: ${t.input.trim() ? t.input.trim().split(/\s+/).length : 0}`; } },
                    
                    // Dev & Code
                    { id: 7, cat: 'dev', name: 'UUID v4 Generator', tag: 'Dev', icon: 'key', desc: 'Generiert eindeutige Identifikatoren.', type: 'generator', output: 'Klick zum Generieren', action: (t) => { t.output = crypto.randomUUID(); } },
                    { id: 8, cat: 'dev', name: 'Passwort Generator', tag: 'Security', icon: 'shield', desc: 'Sichere Zufallspasswörter.', type: 'generator', output: 'Klick zum Generieren', action: (t) => { t.output = Math.random().toString(36).slice(-10) + 'A1!'; } },
                    { id: 9, cat: 'dev', name: 'JSON Formatter', tag: 'Dev', icon: 'brackets', desc: 'Formatiert und validiert JSON.', type: 'input-output', input: '', output: '', action: (t) => { try { t.output = JSON.stringify(JSON.parse(t.input), null, 2); } catch(e) { t.output = 'Ungültiges JSON'; } } },

                    // Media & Video
                    { id: 10, cat: 'media', name: 'Video / Audio Cutter', tag: 'Media', icon: 'scissors', desc: 'Clips direkt im Browser schneiden.', type: 'media-cutter' },
                    { id: 11, cat: 'media', name: 'Aspect Ratio Rechner', tag: 'Media', icon: 'maximize', desc: 'Bildschirmformate berechnen.', type: 'input-output', input: '1920x1080', output: '16:9', action: (t) => { t.output = 'Standard HD Format'; } },

                    // Extras
                    { id: 12, cat: 'extras', name: 'Coin Flipper', tag: 'Fun', icon: 'disc', desc: 'Kopf oder Zahl entscheiden lassen.', type: 'generator', output: 'Bereit', action: (t) => { t.output = Math.random() > 0.5 ? 'Kopf 🪙' : 'Zahl 🪙'; } },
                    { id: 13, cat: 'extras', name: 'Dice Roller', tag: 'Fun', icon: 'box', desc: 'Würfelt eine Zahl von 1 bis 6.', type: 'generator', output: 'Bereit', action: (t) => { t.output = Math.floor(Math.random() * 6) + 1; } }
                ],
                getCurrentCategoryName() {
                    const cat = this.categories.find(c => c.id === this.currentCategory);
                    return cat ? cat.name : '';
                },
                getToolsForCategory() {
                    return this.tools.filter(t => t.cat === this.currentCategory);
                }
            }));
        });
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
